<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomScan Viewer</title>
<style>
  :root {
    --bg: #121315;
    --panel: rgba(22, 23, 26, .9);
    --text: #ece9e3;
    --muted: #9b978f;
    --line: rgba(255, 255, 255, .1);
    --accent: #f2c230;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  .panel {
    position: fixed; padding: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #hud { top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); width: 260px; }
  h1 { margin: 0 0 2px; font-size: 15px; font-weight: 650; }
  #stats { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .seg { display: flex; padding: 3px; margin-bottom: 10px; border-radius: 8px; background: rgba(255, 255, 255, .06); }
  .seg button {
    flex: 1; padding: 6px 0; border: 0; border-radius: 6px;
    background: none; color: var(--muted); font: inherit; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: #141414; font-weight: 600; }
  .seg button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0; }
  .row select, .row input[type=range] { width: 130px; }
  .row select { background: #222327; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; font: inherit; }
  .row[hidden] { display: none; }
  .hint { margin-top: 10px; color: var(--muted); font-size: 11px; }
  summary { color: var(--muted); font-size: 12px; cursor: pointer; }
  details[open] summary { margin-bottom: 4px; }
  #photo {
    top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
    width: 340px; max-height: calc(100% - 28px); overflow: auto; display: none;
  }
  #photo.open { display: block; }
  #photo canvas { display: block; width: auto; height: auto; max-width: 100%; max-height: 42vh; margin: 0 auto; border-radius: 6px; background: #000; }
  #photo h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  #photo table { width: 100%; margin-top: 10px; border-collapse: collapse; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #photo td { padding: 3px 0; border-bottom: 1px solid var(--line); }
  #photo td:last-child { text-align: right; }
  #closePhoto {
    position: absolute; top: 8px; right: 10px; border: 0; background: none;
    color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer;
  }
  .label {
    padding: 4px 7px; border-radius: 5px; white-space: nowrap; pointer-events: none;
    background: rgba(0, 0, 0, .62); color: #fff; font: 11px/1 ui-sans-serif, system-ui, sans-serif;
  }
  #message { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: var(--muted); text-align: center; pointer-events: none; }
  @media (max-width: 720px) {
    #hud { right: calc(14px + env(safe-area-inset-right, 0px)); width: auto; }
    #photo {
      top: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: calc(14px + env(safe-area-inset-left, 0px));
      width: auto; max-height: 55%;
    }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="message">Loading scan&hellip;</div>

<div id="hud" class="panel">
  <h1 id="title">RoomScan</h1>
  <div id="stats"></div>
  <div class="seg">
    <button id="roomMode" class="on">Room</button>
    <button id="knollMode" disabled title="Run roomscan.py locate to find objects">Knolled</button>
  </div>
  <details id="options" open>
  <summary>View options</summary>
  <div class="row"><span>Surface</span><select id="surface"></select></div>
  <div class="row"><span>Ceiling cut</span><input id="cut" type="range" min="0" max="1" step="0.01" value="0.75"></div>
  <div class="row" id="sizeRow"><span>Point size</span><input id="pointSize" type="range" min="1" max="8" step="0.5" value="3"></div>
  <div class="row"><label><input id="showCams" type="checkbox" checked> Camera path</label></div>
  <div class="row"><label><input id="showLabels" type="checkbox" checked> Object labels</label></div>
  <div class="hint">Drag to orbit, right-drag to pan, scroll to zoom. Click a camera to see the photo it took. K toggles knolling.</div>
  </details>
</div>

<div id="photo" class="panel">
  <button id="closePhoto" aria-label="Close">&times;</button>
  <h2 id="photoTitle"></h2>
  <canvas id="photoCanvas"></canvas>
  <table id="photoData"></table>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const SCAN = '/scan/';
const DARK = new THREE.Color(0x121315);
const PAPER = new THREE.Color(0xdcd5c8);
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const lerpAngle = (a, b, t) => a + ((((b - a) % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI) * t;

// ---------------------------------------------------------------- scene

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
$('stage').appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
$('stage').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = DARK.clone();
const ROOM_FOV = 50;
const KNOLL_FOV = 26;
const camera = new THREE.PerspectiveCamera(ROOM_FOV, 1, 0.01, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Soft studio reflections. Generated models are PBR, and many come out fully metallic,
// which renders near-black with lights alone.
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.8;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);

const room = new THREE.Group();
const cams = new THREE.Group();
const things = new THREE.Group();
scene.add(room, cams, things);

// knolled objects sit on an endless paper backdrop that only shows their shadows
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
ground.visible = false;
scene.add(ground);

const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 100);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function message(text) {
  $('message').textContent = text;
  $('message').style.display = text ? 'grid' : 'none';
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}

async function exists(url) {
  try { return (await fetch(url, { method: 'HEAD' })).ok; } catch { return false; }
}

// ---------------------------------------------------------------- scan

let manifest;
try {
  manifest = await getJSON(SCAN + 'frames.json');
} catch (e) {
  message('No scan here. Start the viewer with:  python3 roomscan.py view PATH/TO/SCAN');
  throw e;
}
$('title').textContent = manifest.name || 'Scan';

const objectsDoc = await getJSON(SCAN + 'out/objects.json').catch(() => null);

const surfaces = [];
for (const [name, path] of [['Mesh', 'out/mesh.ply'], ['Point cloud', 'out/cloud.ply'], ['ARKit mesh', manifest.mesh]]) {
  if (path && await exists(SCAN + path)) surfaces.push({ name, url: SCAN + path });
}
for (const s of surfaces) $('surface').add(new Option(s.name, s.url));

const loaded = new Map();
let surface = null;
let pointCount = 0;

async function loadSurface(url) {
  if (url.endsWith('.obj')) {
    const obj = await new OBJLoader().loadAsync(url);
    obj.traverse(n => {
      if (n.isMesh) n.material = new THREE.MeshStandardMaterial({ color: 0xb9b4aa, roughness: 0.9, side: THREE.DoubleSide });
    });
    return obj;
  }
  const geometry = await new PLYLoader().loadAsync(url);
  const colored = !!geometry.attributes.color;
  if (geometry.index) {
    return new THREE.Mesh(geometry, colored
      ? new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })
      : new THREE.MeshStandardMaterial({ color: 0xb9b4aa, side: THREE.DoubleSide }));
  }
  pointCount = geometry.attributes.position.count;
  return new THREE.Points(geometry, new THREE.PointsMaterial({ vertexColors: colored, size: 0.004 * $('pointSize').value }));
}

function eachRoomMaterial(fn) {
  room.traverse(n => { if (n.material) [n.material].flat().forEach(fn); });
}

function setRoomOpacity(opacity) {
  room.visible = opacity > 0.01;
  eachRoomMaterial(m => {
    const fading = opacity < 0.999;
    if (m.transparent !== fading) { m.transparent = fading; m.needsUpdate = true; }
    m.opacity = opacity;
    m.depthWrite = !fading;
  });
}

async function showSurface(url) {
  message('Loading ' + url.split('/').pop() + '\u2026');
  if (!loaded.has(url)) loaded.set(url, await loadSurface(url));
  if (surface) room.remove(surface);
  surface = loaded.get(url);
  room.add(surface);
  eachRoomMaterial(m => { m.clippingPlanes = [cutPlane]; });
  $('sizeRow').hidden = !surface.isPoints;
  setRoomOpacity(1 - clamp(knoll * 1.6, 0, 1));
  updateStats();
  message('');
}

// ---------------------------------------------------------------- cameras

const frames = manifest.frames;
const poses = frames.map(f => new THREE.Matrix4().set(...f.transform.flat()));

function frustum(f, pose, size) {
  const k = f.intrinsics, W = manifest.image.width, H = manifest.image.height;
  const apex = new THREE.Vector3().applyMatrix4(pose);
  const corners = [[0, 0], [W, 0], [W, H], [0, H]].map(([u, v]) =>
    new THREE.Vector3((u - k.cx) / k.fx * size, -(v - k.cy) / k.fy * size, -size).applyMatrix4(pose));
  const segments = [];
  corners.forEach((c, i) => segments.push(apex, c, c, corners[(i + 1) % 4]));
  return { apex, segments };
}

const linePositions = [];
const lineColors = [];
const apexes = [];
frames.forEach((f, i) => {
  const color = new THREE.Color().setHSL(0.58 - 0.45 * (i / Math.max(1, frames.length - 1)), 0.75, 0.58);
  const { apex, segments } = frustum(f, poses[i], 0.08);
  apexes.push(apex);
  for (const p of segments) { linePositions.push(p.x, p.y, p.z); lineColors.push(color.r, color.g, color.b); }
});
const lineGeometry = new THREE.BufferGeometry();
lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));
cams.add(new THREE.LineSegments(lineGeometry, new THREE.LineBasicMaterial({ vertexColors: true })));
const pickable = new THREE.Points(new THREE.BufferGeometry().setFromPoints(apexes),
  new THREE.PointsMaterial({ color: 0xffffff, size: 5, sizeAttenuation: false }));
cams.add(pickable);

const selected = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xf2c230 }));
selected.visible = false;
cams.add(selected);

function uprightTurns(t) {
  // world up in camera axes is the second row of the rotation; in image axes +v runs down
  const ux = t[1][0], uy = -t[1][1];
  const scores = [-uy, ux, uy, -ux];
  return scores.indexOf(Math.max(...scores));
}

async function showPhoto(i) {
  const f = frames[i];
  const { segments } = frustum(f, poses[i], 0.25);
  selected.geometry.dispose();
  selected.geometry = new THREE.BufferGeometry().setFromPoints(segments);
  selected.visible = true;

  $('photoTitle').textContent = `Frame ${f.index}`;
  const fmt = v => v.toFixed(2);
  const [x, y, z] = f.position;
  const heading = Math.atan2(f.forward[0], -f.forward[2]) * 180 / Math.PI;
  $('photoData').innerHTML = [
    ['rgb', f.rgb], ['depth', f.depth],
    ['position x', fmt(x) + ' m'], ['position y', fmt(y) + ' m'], ['position z', fmt(z) + ' m'],
    ['heading', heading.toFixed(0) + '\u00b0'], ['focal length', f.intrinsics.fx.toFixed(0) + ' px'],
  ].map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  $('photo').classList.add('open');

  const img = new Image();
  img.src = SCAN + f.rgb;
  await img.decode();
  const turns = uprightTurns(f.transform);
  const canvas = $('photoCanvas');
  canvas.width = turns % 2 ? img.height : img.width;
  canvas.height = turns % 2 ? img.width : img.height;
  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(-turns * Math.PI / 2);  // photos are stored landscape; turn them upright
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
}

$('closePhoto').onclick = () => { $('photo').classList.remove('open'); selected.visible = false; };

const raycaster = new THREE.Raycaster();
let pressed = null;
renderer.domElement.addEventListener('pointerdown', e => { pressed = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!pressed || Math.hypot(e.clientX - pressed[0], e.clientY - pressed[1]) > 4 || !cams.visible) return;
  const ndc = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  raycaster.params.Points.threshold = camera.position.distanceTo(controls.target) * 0.015;
  const hit = raycaster.intersectObject(pickable)[0];
  if (hit) showPhoto(hit.index);
});

// ---------------------------------------------------------------- objects

const PALETTE = [0xf2c230, 0x6cc3d5, 0xef7d57, 0x9bd16b, 0xc58fe0, 0xf28fb1, 0x7f9cf5, 0xd6b38a];
const categories = [...new Set((objectsDoc?.objects ?? []).map(o => o.category || 'object'))];

function makeItem(o) {
  const [w, h, d] = o.size;
  const color = PALETTE[categories.indexOf(o.category || 'object') % PALETTE.length];
  const holder = new THREE.Group();  // sits at the bottom center of the object
  const body = new THREE.Group();    // the part that tumbles in flight, pivoting on its middle
  body.position.y = h / 2;
  holder.add(body);
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.85, transparent: true, opacity: 0.45, depthWrite: false }));
  box.castShadow = true;
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry), new THREE.LineBasicMaterial({ color }));
  body.add(box, edges);
  const tag = document.createElement('div');
  tag.className = 'label';
  tag.textContent = o.label || o.id;
  const label = new CSS2DObject(tag);
  label.position.y = h + 0.06;
  holder.add(label);
  holder.position.set(o.center[0], o.center[1] - h / 2, o.center[2]);
  holder.rotation.y = o.yaw || 0;
  things.add(holder);
  const item = { o, w, h, d, holder, body, box, edges, label, seed: Math.random(),
    from: { p: holder.position.clone(), yaw: holder.rotation.y }, to: null };
  loadModel(item);
  return item;
}

// A generated model (out/models/<id>.glb) replaces the box, scaled to the measured height.
async function loadModel(item) {
  const url = SCAN + 'out/' + (item.o.model || `models/${item.o.id}.glb`);
  if (!(await exists(url))) return;
  const gltf = await new GLTFLoader().loadAsync(url);
  const model = gltf.scene;
  const bounds = new THREE.Box3().setFromObject(model);
  const size = bounds.getSize(new THREE.Vector3());
  const fit = item.o.modelScale ?? (size.y > 1e-6 && item.h > 0.05
    ? item.h / size.y
    : Math.max(item.w, item.d) / Math.max(size.x, size.z, 1e-6));
  model.position.copy(bounds.getCenter(new THREE.Vector3())).multiplyScalar(-1);
  model.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
  const wrap = new THREE.Group();
  wrap.scale.setScalar(fit);
  wrap.rotation.y = THREE.MathUtils.degToRad(item.o.modelYaw || 0);
  wrap.add(model);
  item.body.add(wrap);
  item.box.visible = false;
  item.edges.visible = false;
}

const items = (objectsDoc?.objects ?? []).map(makeItem);
$('knollMode').disabled = items.length === 0;

// ---------------------------------------------------------------- framing

let bounds = new THREE.Box3();
let floorY = 0;
let roomHeight = 2.5;
let layout = null;

function frameRoom() {
  bounds = surface ? new THREE.Box3().setFromObject(surface) : new THREE.Box3().setFromPoints(apexes);
  floorY = objectsDoc?.floor ?? bounds.min.y;
  roomHeight = Math.max(0.5, bounds.max.y - floorY);
  const center = bounds.getCenter(new THREE.Vector3());
  const span = bounds.getSize(new THREE.Vector3()).length();
  controls.target.copy(center).setY(floorY + roomHeight * 0.3);
  camera.position.copy(controls.target).add(new THREE.Vector3(0.45, 0.85, 0.75).multiplyScalar(span * 0.75));
  applyCut();
}

function applyCut() {
  cutPlane.constant = floorY + roomHeight * Number($('cut').value) + 0.01;
}

// Knolling: everything squared up and laid out in rows by category, biggest first.
function layOut() {
  const heights = items.map(it => it.h).sort((a, b) => a - b);
  const gap = Math.max(0.15, 0.25 * heights[Math.floor(heights.length / 2)]);
  const list = [...items].sort((a, b) =>
    (a.o.category || '').localeCompare(b.o.category || '') || b.w * b.d - a.w * a.d);
  const area = list.reduce((s, it) => s + (it.w + gap) * (it.d + gap), 0);
  const rowWidth = Math.max(Math.sqrt(area) * 1.3, ...list.map(it => it.w));
  const rows = [[]];
  let x = 0;
  for (const it of list) {
    if (x > 0 && x + it.w > rowWidth) { rows.push([]); x = 0; }
    rows.at(-1).push(it);
    it.slot = [x + it.w / 2, 0];
    x += it.w + gap;
  }
  // Seen from the front and above, tall things lean back over the row behind, so rows of tall
  // things get more room in front of them.
  let z = 0;
  rows.forEach((row, r) => {
    if (r > 0) z += gap + 0.4 * Math.max(...row.map(it => it.h));
    for (const it of row) it.slot[1] = z + it.d / 2;
    z += Math.max(...row.map(it => it.d));
  });
  const depth = z;
  const center = bounds.getCenter(new THREE.Vector3()).setY(floorY);
  list.forEach((it, i) => {
    it.order = list.length > 1 ? i / (list.length - 1) : 0;
    it.to = { p: new THREE.Vector3(center.x - rowWidth / 2 + it.slot[0], floorY, center.z - depth / 2 + it.slot[1]), yaw: 0 };
  });
  const span = Math.max(rowWidth, depth);
  ground.position.set(center.x, floorY, center.z);
  sun.position.copy(center).add(new THREE.Vector3(span * 0.35, span * 1.6 + 1, span * 0.5));
  sun.target.position.copy(center);
  Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 0.1, far: span * 4 + 4 });
  sun.shadow.camera.updateProjectionMatrix();
  return { center, width: rowWidth, depth, tallest: Math.max(...list.map(it => it.h)) };
}

// ---------------------------------------------------------------- knolling animation

let knoll = 0;
let anim = null;
let roomView = null;

function setMode(mode) {
  if (mode === 'knoll' && !items.length) return;
  $('roomMode').classList.toggle('on', mode === 'room');
  $('knollMode').classList.toggle('on', mode === 'knoll');
  const view = { pos: camera.position.clone(), target: controls.target.clone() };
  let to;
  if (mode === 'knoll') {
    roomView = view;
    // nearly overhead through a long lens, so it reads like a flat-lay photo
    const { center, width, depth, tallest } = layout;
    const vertical = THREE.MathUtils.degToRad(KNOLL_FOV) / 2;
    const horizontal = Math.atan(Math.tan(vertical) * camera.aspect);
    const distance = 1.5 * Math.max(width / 2 / Math.tan(horizontal), depth / 2 / Math.tan(vertical)) + tallest;
    to = { target: center.clone(), pos: center.clone().add(new THREE.Vector3(0, distance * 0.94, distance * 0.34)), fov: KNOLL_FOV };
  } else {
    to = roomView ?? view;
  }
  view.fov = camera.fov;
  to.fov ??= ROOM_FOV;
  anim = { start: performance.now(), from: knoll, to: mode === 'knoll' ? 1 : 0, view, viewTo: to };
}

function applyKnoll(t) {
  for (const it of items) {
    const e = ease(clamp(t * 1.5 - it.order * 0.5, 0, 1));
    const lift = Math.sin(Math.PI * e);
    it.holder.position.lerpVectors(it.from.p, it.to.p, e);
    it.holder.position.y += lift * (0.45 + 0.7 * it.seed);
    it.holder.rotation.y = lerpAngle(it.from.yaw, it.to.yaw, e);
    it.body.rotation.x = lift * (it.seed - 0.5) * 1.4;
    it.body.rotation.z = lift * (0.5 - it.seed * 0.8) * 1.0;
  }
  setRoomOpacity(1 - clamp(t * 1.6, 0, 1));
  cams.visible = $('showCams').checked && t < 0.02;
  scene.background.copy(DARK).lerp(PAPER, ease(t));
  ground.visible = t > 0.01;
  ground.material.opacity = 0.22 * t;
}

const DURATION = 2800;
renderer.setAnimationLoop(now => {
  if (anim) {
    const p = clamp((now - anim.start) / DURATION, 0, 1);
    knoll = anim.from + (anim.to - anim.from) * p;
    applyKnoll(knoll);
    const c = ease(p);
    camera.position.lerpVectors(anim.view.pos, anim.viewTo.pos, c);
    controls.target.lerpVectors(anim.view.target, anim.viewTo.target, c);
    camera.fov = anim.view.fov + (anim.viewTo.fov - anim.view.fov) * c;
    camera.updateProjectionMatrix();
    if (p >= 1) anim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

// ---------------------------------------------------------------- controls

function updateStats() {
  const parts = [`${frames.length} photos`];
  if (surface?.isPoints) parts.push(`${(pointCount / 1e6).toFixed(pointCount > 1e6 ? 1 : 2)}M points`);
  if (items.length) parts.push(`${items.length} objects`);
  $('stats').textContent = parts.join(' \u00b7 ');
}

if (matchMedia('(max-width: 720px)').matches) $('options').open = false;  // keep the room visible on phones
$('roomMode').onclick = () => setMode('room');
$('knollMode').onclick = () => setMode('knoll');
addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'k') setMode(knoll > 0.5 || anim?.to === 1 ? 'room' : 'knoll');
});
$('surface').onchange = e => showSurface(e.target.value);
$('cut').oninput = applyCut;
$('pointSize').oninput = e => eachRoomMaterial(m => { if (m.isPointsMaterial) m.size = 0.004 * e.target.value; });
$('showCams').onchange = e => { cams.visible = e.target.checked && knoll < 0.02; };
$('showLabels').onchange = e => items.forEach(it => { it.label.visible = e.target.checked; });

if (surfaces.length) {
  await showSurface(surfaces[0].url);
} else {
  message('No 3D yet. Run:  python3 roomscan.py cloud SCAN');
  setTimeout(() => message(''), 4000);
}
frameRoom();
layout = items.length ? layOut() : null;
updateStats();
window.viewer = { showPhoto, setMode, items, manifest };  // handy from the browser console
</script>
</body>
</html>
